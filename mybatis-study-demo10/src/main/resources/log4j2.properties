# ?????????
status = warn
name = PropertiesConfig
property.basePath = ./logs
property.pattern = %d{yyyy-MM-dd HH:mm:ss.SSS} [%t] %-5level %logger{36}:%L - %msg%n

# 1. ???????
appender.console.type = Console
appender.console.name = STDOUT
appender.console.target = SYSTEM_OUT
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = ${pattern}
appender.console.layout.charset = UTF-8

# 2. ??????????? + ????????
appender.rolling.type = RollingFile
appender.rolling.name = RollingFile
appender.rolling.fileName = ${basePath}/app.log
appender.rolling.filePattern = ${basePath}/app-%d{yyyy-MM-dd}-%i.log.gz
appender.rolling.layout.type = PatternLayout
appender.rolling.layout.pattern = ${pattern}
appender.rolling.layout.charset = UTF-8
appender.rolling.policies.type = Policies
appender.rolling.policies.time.type = TimeBasedTriggeringPolicy
appender.rolling.policies.time.interval = 1
appender.rolling.policies.size.type = SizeBasedTriggeringPolicy
appender.rolling.policies.size.size = 50MB
appender.rolling.strategy.type = DefaultRolloverStrategy
appender.rolling.strategy.max = 20

# 3. ???????
logger.app.name = com.sonnet
logger.app.level = debug
logger.app.additivity = false
logger.app.appenderRef.stdout.ref = STDOUT
logger.app.appenderRef.rolling.ref = RollingFile

# 4. Root Logger ??
rootLogger.level = info
rootLogger.appenderRef.stdout.ref = STDOUT
rootLogger.appenderRef.rolling.ref = RollingFile